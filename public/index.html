<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#000">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--s1:#0b1120;--s2:#16203a;--tx:#eef2fb;--mu:#93a0bd;--ac:#e11d48;--tl:#00b7ff;--glow:0 0 22px rgba(0,183,255,.55);--r:14px;--pad:clamp(16px,4vw,48px)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:400 16px/1.5 'Rajdhani',system-ui,sans-serif;padding-bottom:72px;min-height:100vh}
h1,h2,h3,.logo{font-family:'Orbitron',system-ui,sans-serif;line-height:1.05}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:12px var(--pad);background:rgba(0,0,0,.88);backdrop-filter:blur(14px)}
.logo{font-weight:800;font-size:1.6rem;letter-spacing:-.03em}.logo{color:var(--tl);text-shadow:var(--glow)}.logo b{color:var(--ac);text-shadow:0 0 20px rgba(225,29,72,.65)}
nav{display:none;gap:4px}nav a{padding:8px 12px;border-radius:99px;color:var(--mu);font-weight:500}nav a:hover,nav a.on{color:var(--tx);background:var(--s1)}
.search{margin-left:auto;flex:1;max-width:340px}.search input{width:100%;padding:10px 16px;border-radius:99px;border:1px solid var(--s2);background:var(--s1);color:var(--tx);font:inherit}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:rgba(8,13,26,.96);backdrop-filter:blur(14px);padding-bottom:env(safe-area-inset-bottom,0)}
.tabbar a{flex:1;text-align:center;padding:12px 2px;font-size:.78rem;color:var(--mu)}.tabbar a.on{color:var(--tl);text-shadow:var(--glow);font-weight:600}
@media(min-width:900px){nav{display:flex}.tabbar{display:none}body{padding-bottom:0}}
main{padding-bottom:40px}.pad{padding:0 var(--pad)}
.hero{position:relative;min-height:min(78vh,640px);display:flex;align-items:flex-end;background:#000 center/cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 4%,rgba(0,0,0,.35) 55%,rgba(0,0,0,.7)),linear-gradient(90deg,rgba(0,0,0,.85),transparent 65%)}
.hero>div{position:relative;z-index:1;padding:var(--pad);max-width:720px}
.hero h1,.title-page h1,section>h2{text-shadow:var(--glow)}.hero h1{font-size:clamp(2.4rem,7vw,5rem);font-weight:800;letter-spacing:-.035em}
.hero p{color:#cfd7ea;margin:14px 0 22px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{color:var(--mu);font-size:.9rem;margin-top:10px}.meta .st{color:var(--tl);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:99px;font-weight:600;background:var(--s2);margin:0 8px 8px 0}
.btn.p{background:var(--ac);color:#fff}.btn:hover{filter:brightness(1.12)}
section{margin-top:34px}section>h2{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:0 var(--pad) 14px}
.row{display:flex;gap:14px;overflow-x:auto;padding:4px var(--pad) 12px;scroll-snap-type:x proximity;scrollbar-width:thin}
.row .card{flex:0 0 clamp(130px,17vw,190px);scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(130px,42vw,190px),1fr));gap:18px 14px;padding:0 var(--pad)}
.card{display:block;text-align:left}.card .im{aspect-ratio:2/3;border-radius:var(--r);background:var(--s1) center/cover;position:relative;overflow:hidden;transition:transform .2s}
.card:hover .im{transform:translateY(-4px)}.card h3{font:600 .92rem/1.25 'Rajdhani';margin-top:8px}.card small{color:var(--mu)}
.badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.85);padding:2px 8px;border-radius:99px;font-size:.78rem;color:var(--tl);font-weight:600}
.pills{display:flex;gap:8px;overflow-x:auto;padding:0 var(--pad) 16px;scrollbar-width:none}.pills button{flex:none;padding:8px 16px;border-radius:99px;background:var(--s1);color:var(--mu);font-weight:500}.pills button.on{background:var(--ac);color:#fff}
.title-page{padding:var(--pad);display:grid;gap:28px;grid-template-columns:1fr}.title-page .poster{border-radius:var(--r);width:min(260px,60%);aspect-ratio:2/3;background:var(--s1) center/cover}
@media(min-width:800px){.title-page{grid-template-columns:260px 1fr}}
.bd{position:fixed;inset:0;z-index:-1;background:center/cover;opacity:.18;filter:blur(2px)}
.title-page h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:800;letter-spacing:-.03em}.title-page p{max-width:70ch;margin:14px 0;color:#cfd7ea}
.chip{display:inline-block;background:var(--s1);padding:4px 12px;border-radius:99px;margin:0 6px 6px 0;font-size:.85rem;color:var(--mu)}
.eps{display:grid;gap:10px;margin-top:12px}.ep{display:flex;gap:12px;background:var(--s1);border-radius:var(--r);padding:10px;align-items:center}.ep i{width:110px;aspect-ratio:16/9;background:var(--s2) center/cover;border-radius:8px;flex:none}.ep small{color:var(--mu);display:block}
select{background:var(--s1);color:var(--tx);border:1px solid var(--s2);padding:8px 12px;border-radius:10px;font:inherit}
.ch{background:var(--s1);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;text-align:left}.ch:hover{background:var(--s2)}
.ch i{flex:none;width:44px;height:44px;border-radius:12px;background:var(--s2);display:grid;place-items:center;font:800 1rem 'Orbitron';color:var(--tl);font-style:normal}.ch small{color:var(--mu);display:block}.ch .live{color:#ff6b6b;font-size:.75rem;font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:0 var(--pad)}
.fx{display:flex;justify-content:space-between;gap:12px;background:var(--s1);padding:14px 16px;border-radius:var(--r)}.fx b{font-weight:600}.fx span{color:var(--mu);font-size:.85rem;text-align:right}
.msg{margin:var(--pad);padding:20px;border-radius:var(--r);background:var(--s1);color:var(--mu)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,8,15,.92);display:none;place-items:center;padding:16px}.modal.on{display:grid}
.pw{width:min(1100px,100%)}.pw .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.pw .v{aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden}.pw iframe,.pw video{width:100%;height:100%;border:0}
.card:hover .im{box-shadow:0 0 0 2px var(--tl),0 0 26px rgba(0,183,255,.45)}.sk{background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200%;animation:sh 1.3s infinite}@keyframes sh{to{background-position:-200%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
footer{padding:30px var(--pad);color:var(--mu);font-size:.8rem}

:root{--r:4px;--cut:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
body{font-size:18px;font-weight:500;background:#000}

</style></head><body>
<canvas id="bgfx" aria-hidden="true"></canvas>
<header><a class="logo" href="#/">Free<b>Flixx</b></a>
<nav id="nav"></nav><form class="search" onsubmit="event.preventDefault();location.hash='#/search/'+encodeURIComponent(this.q.value)"><input name="q" type="search" placeholder="Search movies and series" aria-label="Search"></form></header>
<main id="app"></main>
<footer>Metadata and trailers by TMDB (not endorsed or certified by TMDB). Live channels from iptv-org. Classics from the Internet Archive. Fixtures from TheSportsDB.</footer>
<div class="tabbar" id="tabs"></div>
<div class="modal" id="modal"><div class="pw"><div class="bar"><b id="pt"></b><button class="btn" onclick="closeP()">Close</button></div><div class="v" id="pv"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app'),IMG='https://image.tmdb.org/t/p/';
const j=async u=>{const r=await fetch(u);if(!r.ok){let e={};try{e=await r.json()}catch{}throw new Error(e.error||'Request failed ('+r.status+')')}return r.json()};
const T=p=>j('/api/tmdb'+p),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get:()=>{try{return JSON.parse(localStorage.ffList||'[]')}catch{return[]}},toggle(i){let l=this.get();const k=l.findIndex(x=>x.id==i.id&&x.t==i.t);k>-1?l.splice(k,1):l.unshift(i);localStorage.ffList=JSON.stringify(l);return k<0}};
const NAV=[['','Home'],['movies','Movies'],['series','Series'],['live','Live TV'],['sports','Sports'],['classics','Classics'],['list','My List']];
const navHTML=r=>NAV.map(([h,n])=>`<a href="#/${h}" class="${r===h?'on':''}">${n}</a>`).join('');
const sk=n=>`<div class="row">${Array(n).fill('<div class="card"><div class="im sk"></div></div>').join('')}</div>`;
const err=e=>`<div class="msg"><b>Couldn't load this.</b><br>${esc(e.message)}</div>`;
const card=(x,t)=>{t=x.media_type||t||(x.title?'movie':'tv');if(t==='person')return'';const y=(x.release_date||x.first_air_date||'').slice(0,4);
return`<a class="card" href="#/title/${t}/${x.id}"><div class="im" style="background-image:url(${x.poster_path?IMG+'w342'+x.poster_path:''})">${x.vote_average?`<span class="badge">★ ${x.vote_average.toFixed(1)}</span>`:''}</div><h3>${esc(x.title||x.name)}</h3><small>${y}</small></a>`};
const row=(h,items,t)=>`<section><h2>${h}</h2><div class="row">${items.map(x=>card(x,t)).join('')}</div></section>`;
function openP(title,html,after){$('#pt').textContent=title;$('#pv').innerHTML=html;$('#modal').classList.add('on');after&&after()}
function closeP(){$('#modal').classList.remove('on');$('#pv').innerHTML=''}
addEventListener('keydown',e=>e.key==='Escape'&&closeP());
function hls(url){const v=$('#pv video');if(v.canPlayType('application/vnd.apple.mpegurl'))v.src=url;else if(window.Hls&&Hls.isSupported()){const h=new Hls();h.loadSource(url);h.attachMedia(v)}v.play().catch(()=>{})}
const R={
async ''(){app.innerHTML=sk(1);
 const [tr,mv,tv,top,up]=await Promise.all([T('/trending/all/day'),T('/trending/movie/week'),T('/trending/tv/week'),T('/movie/top_rated'),T('/movie/upcoming')]);
 const h=tr.results.filter(x=>x.backdrop_path&&x.media_type!=='person')[0];const t=h.media_type;
 app.innerHTML=`<div class="hero" style="background-image:url(${IMG}w1280${h.backdrop_path})"><div><h1>${esc(h.title||h.name)}</h1><div class="meta"><span class="st">★ ${h.vote_average.toFixed(1)}</span> &nbsp;${(h.release_date||h.first_air_date||'').slice(0,4)} &nbsp;${t==='tv'?'Series':'Movie'}</div><p>${esc(h.overview)}</p><a class="btn p" href="#/title/${t}/${h.id}">Watch trailer and details</a><a class="btn" href="#/live">Live TV now</a></div></div>`+
 row('Trending movies',mv.results,'movie')+row('Trending series',tv.results,'tv')+row('Top rated',top.results,'movie')+row('Coming soon',up.results,'movie')},
async movies(){return browse('movie','Movies')},async series(){return browse('tv','Series')},
async title(t,id){app.innerHTML='<div class="msg">Loading…</div>';
 const d=await T(`/${t}/${id}?append_to_response=videos,credits,similar`);const nm=d.title||d.name;
 const tr=(d.videos.results.find(v=>v.site==='YouTube'&&v.type==='Trailer')||d.videos.results.find(v=>v.site==='YouTube'));
 const inList=store.get().some(x=>x.id==id&&x.t==t);window._cur={id:+id,t,title:nm,poster_path:d.poster_path};
 app.innerHTML=`<div class="bd" style="background-image:url(${IMG}w780${d.backdrop_path||''})"></div><div class="title-page"><div class="poster" style="background-image:url(${d.poster_path?IMG+'w500'+d.poster_path:''})"></div><div>
 <h1>${esc(nm)}</h1><div class="meta"><span class="st">★ ${d.vote_average?.toFixed(1)}</span> &nbsp;${(d.release_date||d.first_air_date||'').slice(0,4)} &nbsp;${d.runtime?d.runtime+' min':d.number_of_seasons?d.number_of_seasons+' seasons':''}</div>
 <div style="margin-top:12px">${d.genres.map(g=>`<span class="chip">${esc(g.name)}</span>`).join('')}</div><p>${esc(d.overview)}</p>
 ${tr?`<button class="btn p" onclick="openP('${esc(nm).replace(/'/g,'')} — trailer','<iframe allow=&quot;autoplay;fullscreen&quot; allowfullscreen src=&quot;https://www.youtube.com/embed/${tr.key}?autoplay=1&quot;></iframe>')">Play trailer</button>`:''}
 <button class="btn" id="lb">${inList?'Remove from My List':'Add to My List'}</button><button class="btn" id="fb">Find free full version</button><div id="free"></div>
 <h2 style="margin:26px 0 10px">Cast</h2><div>${d.credits.cast.slice(0,10).map(c=>`<span class="chip">${esc(c.name)}</span>`).join('')}</div>
 ${t==='tv'?`<h2 style="margin:26px 0 10px">Episodes</h2><select id="ss">${d.seasons.filter(s=>s.season_number>0).map(s=>`<option value="${s.season_number}">${esc(s.name)}</option>`).join('')}</select><div class="eps" id="eps"></div>`:''}
 </div></div>`+row('More like this',d.similar.results,t);
 $('#lb').onclick=e=>e.target.textContent=store.toggle(window._cur)?'Remove from My List':'Add to My List';
 $('#fb').onclick=()=>findFree(nm,(d.release_date||d.first_air_date||'').slice(0,4));
 if(t==='tv'){const ld=async()=>{const s=await T(`/tv/${id}/season/${$('#ss').value}`);$('#eps').innerHTML=s.episodes.map(e=>`<div class="ep"><i style="background-image:url(${e.still_path?IMG+'w300'+e.still_path:''})"></i><div><b>${e.episode_number}. ${esc(e.name)}</b><small>${esc((e.overview||'').slice(0,110))}</small></div></div>`).join('')};$('#ss').onchange=ld;ld()}},
async search(q){q=decodeURIComponent(q||'');app.innerHTML=`<section><h2>Results for “${esc(q)}”</h2><div class="grid" id="g">Searching…</div></section>`;const d=await T('/search/multi?query='+encodeURIComponent(q));$('#g').innerHTML=d.results.filter(x=>x.poster_path).map(x=>card(x)).join('')||'<div class="msg">No matches. Try a different spelling.</div>'},
async list(){const l=store.get();app.innerHTML=`<section><h2>My List</h2>${l.length?`<div class="grid">${l.map(x=>card(x,x.t)).join('')}</div>`:'<div class="msg">Nothing saved yet. Open any title and choose Add to My List.</div>'}</section>`},
async classics(){app.innerHTML=`<section><h2>Free classics</h2><p class="pad" style="color:var(--mu);margin-bottom:14px">Public-domain feature films hosted by the Internet Archive.</p><div class="grid" id="g">${Array(12).fill('<div class="card"><div class="im sk"></div></div>').join('')}</div></section>`;
 const d=await j('https://archive.org/advancedsearch.php?q='+encodeURIComponent('collection:feature_films AND mediatype:movies')+'&fl[]=identifier&fl[]=title&fl[]=year&sort[]=downloads+desc&rows=48&output=json');
 $('#g').innerHTML=d.response.docs.map(x=>`<button class="card" data-id="${esc(x.identifier)}" data-t="${esc(x.title)}"><div class="im" style="background-image:url(https://archive.org/services/img/${encodeURIComponent(x.identifier)})"></div><h3>${esc(x.title)}</h3><small>${esc(x.year||'')}</small></button>`).join('');
 $('#g').onclick=e=>{const b=e.target.closest('.card');b&&playArchive(b.dataset.id,b.dataset.t)}},
async live(){app.innerHTML=`<section><h2>Live TV</h2><div class="pills" id="pl"></div><div class="cgrid" id="cg"></div></section>`;
 const cats=['all','news','sports','movies','entertainment','music','kids','documentary','comedy','series','science','weather'];let cur='all';
 const load=async()=>{$('#cg').innerHTML='<div class="msg">Loading channels…</div>';const d=await j('/api/live?cat='+cur);$('#cg').innerHTML=d.map(c=>`<button class="ch" data-u="${esc(c.url)}" data-n="${esc(c.name)}"><i>${esc(c.name.slice(0,2))}</i><div><b>${esc(c.name)}</b><small>${esc(c.cats.join(', ')||'general')} · ${esc(c.country)}</small><span class="live">● Live</span></div></button>`).join('')||'<div class="msg">No channels in this category right now.</div>'};

async function browse(t,label){let page=1,g='';const gs=(await T(`/genre/${t}/list`)).genres;
 app.innerHTML=`<section><h2>${label}</h2><div class="pills" id="pl"><button class="on" data-g="">All</button>${gs.map(x=>`<button data-g="${x.id}">${esc(x.name)}</button>`).join('')}</div><div class="grid" id="g"></div><div class="pad" style="margin-top:20px"><button class="btn" id="more">Load more</button></div></section>`;
 const load=async r=>{const d=await T(`/discover/${t}?sort_by=popularity.desc&page=${page}&with_genres=${g}`);const h=d.results.filter(x=>x.poster_path).map(x=>card(x,t)).join('');r?$('#g').innerHTML=h:$('#g').insertAdjacentHTML('beforeend',h)};
 $('#pl').onclick=e=>{if(e.target.dataset.g===undefined)return;g=e.target.dataset.g;page=1;[...$('#pl').children].forEach(b=>b.classList.toggle('on',b===e.target));load(1)};
 $('#more').onclick=()=>{page++;load()};await load(1)}
async function findFree(nm,yr){const f=$('#free');f.innerHTML='<div class="msg">Searching the Internet Archive…</div>';
 try{const d=await j('https://archive.org/advancedsearch.php?q='+encodeURIComponent(`title:("${nm.replace(/"/g,'')}") AND mediatype:movies AND collection:(feature_films OR classic_tv)`)+'&fl[]=identifier&fl[]=title&rows=5&output=json');const r=d.response.docs;
 f.innerHTML=r.length?`<p style="margin-top:12px">Free versions found:</p>`+r.map(x=>`<button class="btn" data-id="${esc(x.identifier)}" data-t="${esc(x.title)}">${esc(x.title)}</button>`).join(''):'<div class="msg">No free full version found. This title is likely only available on licensed services.</div>';
 f.onclick=e=>{const b=e.target.closest('[data-id]');b&&playArchive(b.dataset.id,b.dataset.t)}}catch(e){f.innerHTML=err(e)}}
const playArchive=(id,t)=>openP(t,`<iframe allowfullscreen src="https://archive.org/embed/${encodeURIComponent(id)}"></iframe>`);

(function(){const c=document.getElementById("bgfx"),x=c.getContext('2d');let W,H,D=Math.min(devicePixelRatio||1,2);
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
const rs=()=>{W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)};rs();addEventListener('resize',rs);
const orbs=[[0,183,255],[225,29,72],[0,120,255],[255,60,110],[80,200,255]].map((col,i)=>({col,x:Math.random()*W,y:Math.random()*H,r:180+Math.random()*220,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,a:.13+i%2*.03}));
const dots=Array.from({length:Math.min(90,W/8|0)},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random(),p:Math.random()*6.28}));
let t=0,run=true;document.addEventListener('visibilitychange',()=>{run=!document.hidden;run&&frame()});
function frame(){if(!run)return;t+=.016;x.fillStyle='#000';x.fillRect(0,0,W,H);x.globalCompositeOperation='lighter';
for(const o of orbs){o.x+=o.vx;o.y+=o.vy;if(o.x<-o.r||o.x>W+o.r)o.vx*=-1;if(o.y<-o.r||o.y>H+o.r)o.vy*=-1;
const g=x.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);g.addColorStop(0,`rgba(${o.col},${o.a})`);g.addColorStop(1,`rgba(${o.col},0)`);x.fillStyle=g;x.fillRect(o.x-o.r,o.y-o.r,o.r*2,o.r*2)}
for(const d of dots){d.y-=.08+d.z*.25;if(d.y<-4){d.y=H+4;d.x=Math.random()*W}const a=.25+.55*Math.abs(Math.sin(t*(.6+d.z)+d.p));x.fillStyle=`rgba(${d.z>.8?'255,92,130':'140,225,255'},${a*.8})`;x.beginPath();x.arc(d.x,d.y,.5+d.z*1.3,0,6.283);x.fill()}
x.globalCompositeOperation='source-over';still||requestAnimationFrame(frame)}frame()})();
